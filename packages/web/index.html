<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A personal flashcard library for storing and recalling detailed information." />
    <meta name="theme-color" content="#244c44" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Keepsake" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Numeric answers are facts, not phone numbers to dial. -->
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/keepsake-icon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Keepsake</title>
    <script>
      // The app opens on the profile list, so ask for it while the app's code loads.
      // The install page at / needs none.
      if (location.pathname !== "/") {
        window.keepsakeProfiles = fetch("/api/profiles");
        window.keepsakeProfiles.catch(() => undefined);
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
