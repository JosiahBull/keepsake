[workspace]
members = ["packages/core", "packages/server", "packages/cli"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
fsrs = "=6.6.2"
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.7", features = ["fs", "compression-gzip", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "5"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
