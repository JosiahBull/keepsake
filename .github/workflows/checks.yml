name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  versions:
    name: Versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check package and tag versions
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          for path in Path("packages").glob("*/Cargo.toml"):
              declared = tomllib.loads(path.read_text())["package"]["version"]
              actual = version if isinstance(declared, dict) and declared.get("workspace") else declared
              if actual != version:
                  raise SystemExit(f"{path}: version {actual} differs from workspace {version}")
          for path in ("package.json", "packages/web/package.json", "packages/client/package.json"):
              actual = json.loads(Path(path).read_text())["version"]
              if actual != version:
                  raise SystemExit(f"{path}: version {actual} differs from workspace {version}")
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              if tag != f"v{version}":
                  raise SystemExit(f"Tag {tag} must match v{version}")
          print(f"Package versions match {version}")
          PY
      - name: Check release publication policy
        run: python3 -m unittest discover -s scripts -p 'test_release.py'

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.9.0
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Check embedded migration rebuilds
        run: node scripts/check-migration-rebuild.mjs
      - run: node scripts/sqlx-prepare.mjs --check

  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:client
      - name: Check generated API client
        run: git diff --exit-code -- packages/client/openapi.json packages/client/src/schema.d.ts
      - run: pnpm --filter @keepsake/web check
      - run: pnpm --filter @keepsake/web build

  browser:
    name: Browser e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust build dependencies
        run: |
          apt-get update
          # CMake builds libopus, the Opus decoder for uploaded clips.
          apt-get install -y --no-install-recommends build-essential pkg-config curl cmake
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require Playwright package and image versions to match
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from "node:fs";
          const version = JSON.parse(readFileSync("packages/web/package.json")).devDependencies["@playwright/test"];
          const workflow = readFileSync(".github/workflows/checks.yml", "utf8");
          if (!workflow.includes(`image: mcr.microsoft.com/playwright:v${version}-noble`)) {
            throw new Error("The Playwright package and CI image must use the same exact version.");
          }
          JS
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: |
            packages/web/playwright-report
            packages/web/test-results
            packages/web/tests/*-snapshots
          if-no-files-found: ignore
          retention-days: 7

  image-platform:
    name: Container (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: keepsake:ci-${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Smoke test container and shared SQLite storage
        env:
          IMAGE: keepsake:ci-${{ matrix.arch }}
        run: bash scripts/container-smoke.sh "$IMAGE"

  image:
    name: Container build
    needs: image-platform
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require both native container tests
        env:
          RESULT: ${{ needs.image-platform.result }}
        run: test "$RESULT" = success
